; PlatformIO Project Configuration File — Speedrack Display Firmware
; Target: Waveshare ESP32-C6-LCD-1.47 (non-touch)
; Framework: ESP-IDF with esp_lcd, esp_lvgl_port, and MQTT

[platformio]
src_dir = main

[env:speedrack_display]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

board_build.sdkconfig_defaults = sdkconfig.defaults
; PlatformIO picks the partition CSV itself (board_build.partitions),
; independent of the ESP-IDF PARTITION_TABLE_* Kconfig choice in
; sdkconfig.defaults — the default 1MB app partition is too small for the
; LVGL UI + Wi-Fi + MQTT image (~1.4MB); this chip has 8MB flash.
board_build.partitions = partitions_singleapp_large.csv
