; PlatformIO Project Configuration File — Speedrack Display Firmware
; Target: Waveshare ESP32-C6-Touch-LCD-1.47
; Framework: ESP-IDF (required for BSP, esp_lvgl_port, and MQTT client)

[env:speedrack_display]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

board_build.sdkconfig_defaults = sdkconfig.defaults
