## ESP-IDF Component Manager manifest for the main application component.
##
## This board (Waveshare ESP32-C6-LCD-1.47, non-touch) uses ST7789, a
## built-in ESP-IDF panel type (esp_lcd_new_panel_st7789() in the core
## esp_lcd component) — no BSP component or vendored driver is needed.

dependencies:
  idf: ">=5.1"

  lvgl/lvgl:
    version: "^9.5.0"

  espressif/esp_lvgl_port:
    version: "*"

  espressif/mqtt:
    version: "^1.0.0"
